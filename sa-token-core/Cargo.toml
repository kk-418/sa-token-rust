[package]
name = "sa-token-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core library for sa-token-rust, a powerful authentication and authorization framework"

[dependencies]
sa-token-adapter = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
hex = "0.4.3"
getrandom = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
sha1 = { workspace = true }
data-encoding = { workspace = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
sa-token-storage-memory = { workspace = true }

[features]
default = []
# 使用 jsonwebtoken 的 RustCrypto 后端（含 RSA / EC / EdDSA）。默认关闭：内置仅 HMAC 后端，
# 依赖图不含 rsa（RUSTSEC-2023-0071）。JwtManager 只用 HS256 / HS384 / HS512。
jwt-rust-crypto = ["jsonwebtoken/rust_crypto"]
fory = ["sa-token-adapter/fory"]
sso-http = ["dep:reqwest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
